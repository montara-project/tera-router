services:
  app:
    image: tera-router:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      platforms:
        - linux/amd64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: ${APP_PORT:-8080}
      APP_MACHINE_ID: ${APP_MACHINE_ID:?APP_MACHINE_ID is required}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
      DATABASE_URL: postgres://${POSTGRES_USER:-tera}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-tera}?sslmode=disable
    command:
      - "--env=${APP_ENV:-production}"
      - "--port=${APP_PORT:-8080}"
      - "--machine-id=${APP_MACHINE_ID}"
      - "--app-secret=${APP_SECRET}"
      - "--cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:-*}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health", "||", "exit", "1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tera}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tera} -d ${POSTGRES_DB:-tera}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

networks:
  internal:

volumes:
  postgres-data:
