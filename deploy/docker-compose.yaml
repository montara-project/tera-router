services:
  app:
    image: ghcr.io/montara-project/tera-router:v1.23.0
    restart: unless-stopped
    # APP_PORT is the host port; the container always listens on 8080 so the
    # published mapping, the healthcheck, and EXPOSE stay in agreement.
    ports:
      - "${APP_PORT:-8080}:8080"
    # Every server flag falls back to its environment variable, so no command
    # line is needed: the container env below is the whole configuration.
    environment:
      ENV: ${APP_ENV:-production}
      MACHINE_ID: ${APP_MACHINE_ID:?APP_MACHINE_ID is required}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DEBUG: ${APP_DEBUG:-false}
      # Seeded dashboard admin; a change is synced on the next SEED_ON_BOOT.
      ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@tera.local}
      ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD is required}
      APP_NAME: ${APP_NAME:-tera-router-server}
      # Empty means the server's own default: wildcard in development,
      # same-origin only in production. Set the dashboard origin here.
      CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_EXEMPT_IPS: ${RATE_LIMIT_EXEMPT_IPS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Set true to ignore the dashboard's Restricted Access period, e.g.
      # after locking yourself out; unset it once you are back in.
      RESTRICTED_ACCESS_DISABLED: ${RESTRICTED_ACCESS_DISABLED:-false}
      # Injected into the served web UI at runtime; set only when the API
      # lives on a different origin than the dashboard.
      API_URL: ${API_URL:-}
      DATABASE_PATH: /app/data/terarouter.db
      MIGRATE_ON_BOOT: "true"
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Dashboard SSO via any OIDC provider (Pocket ID, Keycloak, …); the
      # login button appears only when issuer + client id + secret are set.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_REQUIRE_EMAIL_VERIFIED: ${OIDC_REQUIRE_EMAIL_VERIFIED:-true}
      OIDC_DISABLE_PASSWORD_LOGIN: ${OIDC_DISABLE_PASSWORD_LOGIN:-false}
      OIDC_LINK_EXISTING_ACCOUNTS: ${OIDC_LINK_EXISTING_ACCOUNTS:-true}
      # Create "user" accounts for OIDC emails that match none; false means an
      # admin provisions first while linked accounts keep working.
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-true}
      # Email domains allowed through SSO; empty allows all.
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      # Default Headroom proxy for Settings > Token Saving; a URL saved in the
      # dashboard overrides it. Headroom still has to be switched on there.
      HEADROOM_URL: ${HEADROOM_URL:-http://headroom:8787}
      HEADROOM_PROXY_TOKEN: ${HEADROOM_PROXY_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health", "||", "exit", "1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - tera-data:/app/data
    depends_on:
      headroom:
        condition: service_started
        required: false

  # Optional token-reduction proxy the gateway calls through HEADROOM_URL.
  # Opt in with `docker compose --profile headroom up` and a shared
  # HEADROOM_PROXY_TOKEN (`openssl rand -hex 32`): Headroom refuses a
  # non-loopback bind without one, and /v1/compress answers only loopback
  # callers unless remote access is allowed. The port stays unpublished.
  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:${HEADROOM_VERSION:-0.41.0}
    profiles: [headroom]
    restart: unless-stopped
    # The image entrypoint is already `headroom proxy`, bound to 127.0.0.1.
    environment:
      HEADROOM_HOST: "0.0.0.0"
      HEADROOM_PORT: "8787"
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      HEADROOM_PROXY_TOKEN: ${HEADROOM_PROXY_TOKEN:-}
      # Kompress (ModernBERT on CPU) outruns the gateway's 5s Headroom timeout
      # on large tool results; the structural compressors stay on. Set both to
      # 0 and raise the timeout in Settings > Token Saving to use it.
      HEADROOM_DISABLE_KOMPRESS: ${HEADROOM_DISABLE_KOMPRESS:-1}
      HEADROOM_DISABLE_KOMPRESS_FALLBACK: ${HEADROOM_DISABLE_KOMPRESS_FALLBACK:-1}

volumes:
  tera-data:
