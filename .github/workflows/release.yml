# Publishes the Docker images to GitHub Container Registry and deploys the
# main web to Cloudflare Workers.
#
# Triggers:
#   - a semver tag (v1.2.3) publishes 1.2.3, 1.2 and latest
#   - a manual run publishes the short commit SHA, plus any tag you pass in
#
# Images:
#   ghcr.io/<owner>/tera-router       the Go API + gateway serving the web UI (deploy/Dockerfile)
#   ghcr.io/<owner>/tera-router/docs  apps/docs, the documentation site (deploy/docs.Dockerfile)

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag to publish (the short commit SHA is always published)
        required: false
        type: string

# Only one release per ref; a re-push of the same tag supersedes the running build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64

jobs:
  release-images:
    name: Release ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push the image to ghcr.io with the workflow's GITHUB_TOKEN.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both install from the workspace lockfile, so they build from the root.
          - name: server
            suffix: ''
            file: deploy/Dockerfile
          - name: docs
            suffix: /docs
            file: deploy/docs.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite bakes the VITE_* values into the web UI inside the server
          # image and APP_VERSION goes into the Go binary; the docs image
          # ignores them. VITE_API_URL stays empty for the usual setup, where
          # the server serves the UI itself: set the repo Variable only when
          # the API lives on another origin than the UI.
          build-args: |
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'Tera Router' }}
            VITE_API_URL=${{ vars.VITE_API_URL || '' }}
            APP_VERSION=${{ github.ref_name }}
          push: true
          # One cache scope per image, or the builds evict each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Deploys the main web on every release run (tag push or manual dispatch);
  # the workflow itself never triggers on branch pushes.
  release-main-web:
    name: Deploy main web to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @tera/main...

      - name: Build & Deploy
        run: pnpm deploy:main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
