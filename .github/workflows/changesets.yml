# Versions packages and assembles changelogs from the pending .changeset/*.md
# entries.
#
# Merging any PR into main runs this bot: it consumes the changesets and
# opens/updates a "Version Packages" PR (package.json bumps + CHANGELOG.md
# formatted by @changesets/changelog-github). That PR is merged manually —
# nothing here publishes to npm; Docker images ship via release.yml.

name: Changesets

on:
  push:
    branches: [main]

# One version PR at a time; a new push to main supersedes the running bot.
concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the version PR
        uses: changesets/action@v1
        with:
          # Conventional Commit style to match the repo's commitlint rules.
          commit: 'chore: version packages'
          title: 'chore: version packages'
          version: pnpm changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
